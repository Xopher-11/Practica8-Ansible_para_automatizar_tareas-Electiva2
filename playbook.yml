---
- name: Configurar servidores Ubuntu
  hosts: servidores
  become: true

  tasks:
    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: true

    - name: Crear usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        shell: /bin/bash
        create_home: true

    - name: Crear una carpeta llamada "app"
      ansible.builtin.file:
        path: /app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: Crear archivo hola.txt
      ansible.builtin.copy:
        content: "Hola desde Ansible\n"
        dest: /app/hola.txt
        owner: itla
        group: itla
        mode: '0644'

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present